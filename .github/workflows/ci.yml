name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Spanfold.slnx
      - run: dotnet test Spanfold.slnx --no-restore --configuration Release
      - name: Pack NuGet packages
        run: |
          rm -rf artifacts/package
          dotnet pack src/Spanfold/Spanfold.csproj --no-restore --configuration Release --output artifacts/package
          dotnet pack src/Spanfold.Testing/Spanfold.Testing.csproj --no-restore --configuration Release --output artifacts/package
          dotnet pack src/Spanfold.Cli/Spanfold.Cli.csproj --no-restore --configuration Release --output artifacts/package
      - name: Verify package contents and dependency metadata
        run: |
          set -euo pipefail
          test -f artifacts/package/Spanfold.0.1.0.nupkg
          test -f artifacts/package/Spanfold.Testing.0.1.0.nupkg
          test -f artifacts/package/Spanfold.Cli.0.1.0.nupkg
          unzip -Z1 artifacts/package/Spanfold.0.1.0.nupkg | grep -Fx 'README.md'
          unzip -Z1 artifacts/package/Spanfold.0.1.0.nupkg | grep -Fx 'lib/net10.0/Spanfold.dll'
          unzip -Z1 artifacts/package/Spanfold.0.1.0.nupkg | grep -Fx 'lib/net10.0/Spanfold.xml'
          unzip -Z1 artifacts/package/Spanfold.Testing.0.1.0.nupkg | grep -Fx 'lib/net10.0/Spanfold.Testing.dll'
          unzip -p artifacts/package/Spanfold.Testing.0.1.0.nupkg '*.nuspec' | grep -F '<dependency id="Spanfold"'
          unzip -Z1 artifacts/package/Spanfold.Cli.0.1.0.nupkg | grep -F 'Spanfold.Cli.dll'

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo metadata --locked --no-deps
      - run: cargo check --workspace --locked
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --doc
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: packages/rust/Cargo.toml
