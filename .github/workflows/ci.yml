name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Spanfold.slnx
      - run: dotnet test Spanfold.slnx --no-restore --configuration Release

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo metadata --locked --no-deps
      - run: cargo check --workspace --locked
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --doc
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: packages/rust/Cargo.toml
