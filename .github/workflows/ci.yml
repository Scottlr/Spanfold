name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Spanfold.slnx
      - name: Verify .NET formatting and analyzer style
        run: dotnet format Spanfold.slnx --no-restore --verify-no-changes --severity warn
      - name: Build with .NET analyzers
        run: dotnet build Spanfold.slnx --no-restore --configuration Release
      - run: dotnet test Spanfold.slnx --no-restore --no-build --configuration Release
      - name: Pack NuGet packages
        run: |
          rm -rf artifacts/package
          dotnet pack src/Spanfold/Spanfold.csproj --no-restore --configuration Release --output artifacts/package
          dotnet pack src/Spanfold.Artifacts/Spanfold.Artifacts.csproj --no-restore --configuration Release --output artifacts/package
          dotnet pack src/Spanfold.Testing/Spanfold.Testing.csproj --no-restore --configuration Release --output artifacts/package
      - name: Verify package contents and dependency metadata
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          test -n "$version"
          test -f "artifacts/package/Spanfold.${version}.nupkg"
          test -f "artifacts/package/Spanfold.${version}.snupkg"
          test -f "artifacts/package/Spanfold.Artifacts.${version}.nupkg"
          test -f "artifacts/package/Spanfold.Artifacts.${version}.snupkg"
          test -f "artifacts/package/Spanfold.Testing.${version}.nupkg"
          test -f "artifacts/package/Spanfold.Testing.${version}.snupkg"
          test ! -f "artifacts/package/Spanfold.Cli.${version}.nupkg"
          unzip -Z1 "artifacts/package/Spanfold.${version}.nupkg" | grep -Fx 'README.md'
          unzip -Z1 "artifacts/package/Spanfold.${version}.nupkg" | grep -Fx 'lib/net10.0/Spanfold.dll'
          unzip -Z1 "artifacts/package/Spanfold.${version}.nupkg" | grep -Fx 'lib/net10.0/Spanfold.xml'
          unzip -Z1 "artifacts/package/Spanfold.Artifacts.${version}.nupkg" | grep -Fx 'README.md'
          unzip -Z1 "artifacts/package/Spanfold.Artifacts.${version}.nupkg" | grep -Fx 'lib/net10.0/Spanfold.Artifacts.dll'
          unzip -Z1 "artifacts/package/Spanfold.Artifacts.${version}.nupkg" | grep -Fx 'lib/net10.0/Spanfold.Artifacts.xml'
          unzip -p "artifacts/package/Spanfold.Artifacts.${version}.nupkg" '*.nuspec' | grep -F "<dependency id=\"Spanfold\" version=\"${version}\""
          unzip -Z1 "artifacts/package/Spanfold.Testing.${version}.nupkg" | grep -Fx 'README.md'
          unzip -Z1 "artifacts/package/Spanfold.Testing.${version}.nupkg" | grep -Fx 'lib/net10.0/Spanfold.Testing.dll'
          unzip -Z1 "artifacts/package/Spanfold.Testing.${version}.nupkg" | grep -Fx 'lib/net10.0/Spanfold.Testing.xml'
          unzip -p "artifacts/package/Spanfold.Testing.${version}.nupkg" '*.nuspec' | grep -F "<dependency id=\"Spanfold\" version=\"${version}\""
          unzip -p "artifacts/package/Spanfold.Testing.${version}.nupkg" '*.nuspec' | grep -F "<dependency id=\"Spanfold.Artifacts\" version=\"${version}\""
      - name: Restore isolated package consumers
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/consumer
          for package in Spanfold Spanfold.Artifacts Spanfold.Testing; do
            dotnet restore tests/Spanfold.PackageConsumer/Spanfold.PackageConsumer.csproj \
              --source "$PWD/artifacts/package" \
              --packages "$PWD/artifacts/consumer/$package/packages" \
              -p:PackageUnderTest="$package" \
              -p:BaseIntermediateOutputPath="artifacts/consumer/$package/obj/"
          done

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo metadata --locked --no-deps
      - run: cargo check --workspace --locked
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --workspace --doc
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: packages/rust/Cargo.toml
