[package]
name = "spanfold-cli"
version = "0.1.0"
description = "Preview CLI for Spanfold temporal evidence workflows."
readme = "../../README.md"
documentation = "https://docs.rs/spanfold-cli"
keywords = ["temporal", "interval", "comparison", "cli"]
categories = ["command-line-utilities", "data-structures"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "spanfold"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
spanfold = { version = "0.1.0", path = "../spanfold" }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
