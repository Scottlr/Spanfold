[package]
name = "spanfold-cli"
version = "0.1.0"
description = "Command-line fixture, import, comparison, and audit workflows for Spanfold."
readme = "../../README.md"
publish = ["crates-io"]
keywords = ["temporal", "interval", "comparison", "cli"]
categories = ["command-line-utilities", "data-structures"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "spanfold"
path = "src/main.rs"
doc = false

[dependencies]
clap.workspace = true
csv.workspace = true
serde.workspace = true
serde_json.workspace = true
spanfold = { version = "0.1.0", path = "../spanfold" }

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
tempfile = "3.23.0"
