[package]
name = "spanfold"
version = "0.1.1"
description = "Temporal state-window recording, comparison, and audit primitives for Rust."
readme = "README.md"
documentation = "https://docs.rs/spanfold"
publish = ["crates-io"]
keywords = ["temporal", "interval", "comparison", "state"]
categories = ["data-structures", "algorithms"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.6.0"

[[bench]]
name = "spanfold_benchmarks"
harness = false
